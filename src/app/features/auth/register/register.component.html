<div class="auth-container mt-8">
  <div class="card auth-card">
    <div class="auth-header text-center mb-8">
      <span class="material-symbols-outlined auth-icon">person_add</span>
      <h2>System Registration</h2>
      <p class="text-neutral mt-2">Initialize your enterprise account.</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger mb-4">
      {{ errorMessage }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input 
          id="name" 
          type="text" 
          class="form-control" 
          formControlName="name" 
          placeholder="Jane Doe"
          [class.invalid]="registerForm.get('name')?.invalid && registerForm.get('name')?.touched"
        />
        <div *ngIf="registerForm.get('name')?.invalid && registerForm.get('name')?.touched" class="text-danger">
          Name is required.
        </div>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input 
          id="email" 
          type="email" 
          class="form-control" 
          formControlName="email" 
          placeholder="name@company.com"
          [class.invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
        />
        <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="text-danger">
          A valid email is required.
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input 
          id="password" 
          type="password" 
          class="form-control" 
          formControlName="password" 
          placeholder="Enter password (min 6 chars)"
          [class.invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
        />
        <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="text-danger">
          Password must be at least 6 characters.
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 mt-4" [disabled]="isLoading">
        <span *ngIf="isLoading" class="material-symbols-outlined spin">sync</span>
        {{ isLoading ? 'Registering...' : 'Complete Registration' }}
      </button>
    </form>

    <div class="auth-footer text-center mt-6">
      <p class="text-neutral text-sm">Already provisioned? <a routerLink="/login">Log In</a></p>
    </div>
  </div>
</div>
