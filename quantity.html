<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - Quantity Measurement App</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .calc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 600px) {
            .calc-grid {
                grid-template-columns: 1fr;
            }
        }
        .result-box {
            background-color: #f1f5f9;
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 1.5rem;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        #resultText {
            font-size: 1.25rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">QuantityApp</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="quantity.html" style="color:var(--primary-color);">Calculator</a></li>
                <li class="auth-only" style="display: none;"><a href="history.html">History</a></li>
                <li class="guest-only"><a href="login.html">Login</a></li>
                <li class="auth-only" style="display: none;"><a href="#" id="logoutBtn">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Quantity Calculator</h2>
        
        <div id="calcMessage" class="alert"></div>

        <div class="card">
            <form id="calcForm">
                <div class="calc-grid">
                    <div class="form-group">
                        <label for="operation">Operation</label>
                        <select id="operation">
                            <option value="compare">Compare</option>
                            <option value="convert">Convert</option>
                            <option value="add">Add</option>
                            <option value="subtract">Subtract</option>
                            <option value="divide">Divide</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category">
                            <option value="length">Length</option>
                            <option value="weight">Weight</option>
                            <option value="volume">Volume</option>
                            <option value="temperature">Temperature</option>
                        </select>
                    </div>
                </div>

                <div class="calc-grid mt-4">
                    <div class="form-group">
                        <label for="value1">Value 1</label>
                        <input type="number" id="value1" step="any" required placeholder="Enter value">
                        <select id="unit1" class="mt-4"></select>
                    </div>

                    <div class="form-group" id="value2Group">
                        <label for="value2">Value 2</label>
                        <input type="number" id="value2" step="any" required placeholder="Enter value">
                        <select id="unit2" class="mt-4"></select>
                    </div>
                </div>

                <div class="form-group mt-4" id="targetUnitGroup" style="display: none;">
                    <label for="targetUnit">Result Unit (Target Unit)</label>
                    <select id="targetUnit"></select>
                </div>

                <div class="mt-4" style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn">Calculate</button>
                    <button type="button" id="saveToHistoryBtn" class="btn btn-secondary" style="display: none;">Save to History</button>
                </div>
            </form>

            <div class="result-box mt-4">
                <div id="resultText">Select an operation and enter values to calculate.</div>
            </div>
        </div>
    </div>

    <!-- Scripts must load in this explicit order -->
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/quantity.js"></script>
</body>
</html>
