<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - Quantity Measurement App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">QuantityApp</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="quantity.html">Calculator</a></li>
                <li class="auth-only" style="display: none;"><a href="history.html" style="color:var(--primary-color);">History</a></li>
                <li class="guest-only"><a href="login.html">Login</a></li>
                <li class="auth-only" style="display: none;"><a href="#" id="logoutBtn">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        
        <div class="mb-4" style="background-color: var(--card-bg); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border-color);">
            <h2 style="margin-bottom: 0;">Calculation History</h2>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">Past calculations stored by the backend.</p>
        </div>

        <div id="historyMessage" class="alert"></div>

        <div id="loadingState" class="text-center mt-4">
            <p>Loading history...</p>
        </div>

        <div id="emptyState" class="text-center mt-4" style="display: none;">
            <p class="mb-4">No calculations found in history yet.</p>
            <a href="quantity.html" class="btn">Go to Calculator</a>
        </div>

        <div id="historyTableContainer" style="display: none;">
            <div class="card" style="padding: 0; overflow-x: auto;">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Operation</th>
                            <th>Category</th>
                            <th>Result</th>
                            <th>Message</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <!-- History rows injected here -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Scripts must load in this explicit order -->
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/history.js"></script>
</body>
</html>
