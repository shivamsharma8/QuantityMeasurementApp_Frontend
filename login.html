<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Quantity Measurement App</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">QuantityApp</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="quantity.html">Calculator</a></li>
                <li class="auth-only" style="display: none;"><a href="history.html">History</a></li>
                <li class="guest-only"><a href="login.html">Login</a></li>
                <li class="auth-only" style="display: none;"><a href="#" id="logoutBtn">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container auth-wrapper">
        <div class="card">
            <h2 class="text-center mb-4">Login</h2>
            
            <div id="loginMessage" class="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                
                <button type="submit" class="btn btn-block">Login</button>
            </form>

            <div class="text-center mt-4">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
            </div>

            <!-- Real Google Auth Integration -->
            <div class="google-auth-placeholder text-center mt-4" style="display: flex; flex-direction: column; align-items: center;">
                <p class="mb-4 text-muted">Or sign in with</p>
                <!-- Initialize Google Auth -->
                <div id="g_id_onload"
                     data-client_id="50282433381-o0e8ep2928v993bpck1acgdkk1a5iqq3.apps.googleusercontent.com"
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleGoogleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <!-- Render the button -->
                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="rectangular"
                     data-theme="outline"
                     data-text="signin_with"
                     data-size="large"
                     data-logo_alignment="left">
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts must load in this specific order -->
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/google-auth.js"></script>
</body>
</html>
